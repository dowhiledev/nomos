[project]
name = "nomos"
version = "0.0.1"
description = "Re-Imagining How we build Reliable AI Agents"
readme = "README.md"
authors = [
    { name = "chandralegend", email = "irugalbandarachandra@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120.4",
    "pydantic>=2.12.3",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "typer>=0.20.0",
    "uvicorn>=0.38.0",
]

[project.scripts]
nomos = "nomos:main"

[project.optional-dependencies]
openai = [
    "openai>=2.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.3",
    "httpx>=0.27.2",
]
