[project]
name = "nomos"
version = "0.0.1"
description = "Re-Imagining How we build Reliable AI Agents"
readme = "README.md"
authors = [
    { name = "chandralegend", email = "irugalbandarachandra@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7"
]

[project.scripts]
nomos = "nomos:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]
openai = [
    "openai>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
